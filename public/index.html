<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-Builder Zoho UI</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">ChatBuilder</h1>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" class="nav-item active">Dashboard</a></li>
                    <li><a href="#" class="nav-item">Settings</a></li>
                    <li><a href="#" class="nav-item">Analytics</a></li>
                    <li><a href="#" class="nav-item">Help</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h2>Chat Interface</h2>
                <div class="user-profile">
                    <span class="username">Guest User</span>
                    <div class="avatar"></div>
                </div>
            </header>

            <div class="content-area">
                <!-- Main content panel or cards can go here -->
                <div class="card general-info-card">
                    <h3>Welcome to ChatBuilder!</h3>
                    <p>This is a prototype of the Chat-Builder Zoho UI. Interact with the chat panel below.</p>
                </div>

                <div class="chat-panel">
                    <div class="chat-feed locked-component-text-block" id="chat-feed">
                        <!-- Chat messages will be dynamically inserted here -->
                        <div class="ai-message-row">
                            <div class="ai-bubble">Hello! How can I assist you today?</div>
                        </div>
                    </div>
                    <form class="chat-composer" id="chat-composer">
                        <input type="text" id="chat-input" placeholder="Type your message here..." class="locked-component-button">
                        <button type="submit" class="locked-component-button send-button">Send</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://dlnsgydsevubdbsfpipg.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_PHJsJon2xr4yeXPWxBBaIg_76jD8Op-";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initializeSupabase() {
            try {
                console.log('Supabase client initialized.');
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) {
                    throw error;
                }
                if (!session) {
                    console.log('No active session, signing in anonymously...');
                } else {
                    console.log('User session:', session);
                }
            } catch (error) {
                console.error('Failed to initialize Supabase session:', error);
            }
        }

        initializeSupabase();

        const chatFeed = document.getElementById('chat-feed');
        const chatComposer = document.getElementById('chat-composer');
        const chatInput = document.getElementById('chat-input');

        function addMessageToFeed(content, isUser) {
            const messageRow = document.createElement('div');
            messageRow.classList.add(isUser ? 'user-message-row' : 'ai-message-row');

            const messageBubble = document.createElement('div');
            messageBubble.classList.add(isUser ? 'user-bubble' : 'ai-bubble');
            messageBubble.textContent = content; // Render text, not HTML

            messageRow.appendChild(messageBubble);
            chatFeed.appendChild(messageRow);

            // Scroll to the latest message
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        chatComposer.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = chatInput.value.trim();
            if (!message) return;

            addMessageToFeed(message, true); // Display user message immediately
            chatInput.value = ''; // Clear input

            try {
                // Send message to backend API
                const response = await fetch('/api/backend-api.js', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addMessageToFeed(data.response, false); // Display AI response

                // In a real app, you would save messages to Supabase here.
                // const { error } = await supabase.from('messages').insert([{ content: message, is_user_message: true, user_id: supabase.auth.user().id }]);
                // if (error) console.error('Error saving user message:', error);
                // const { error: aiError } = await supabase.from('messages').insert([{ content: data.response, is_user_message: false, user_id: supabase.auth.user().id }]);
                // if (aiError) console.error('Error saving AI message:', aiError);

            } catch (error) {
                console.error('Error sending message to backend:', error);
                addMessageToFeed('Error: Could not get a response from the AI.', false);
            }
        });
    </script>
</body>
</html>
