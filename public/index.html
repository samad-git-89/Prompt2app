<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Cooking App</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1 class="header text-block app-title">FlavorFusion</h1>
                <nav class="main-nav">
                    <a href="#" class="nav-item">Recipes</a>
                    <a href="#" class="nav-item">Categories</a>
                    <a href="#" class="nav-item">About Us</a>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <section class="hero-banner">
                <div class="hero-overlay"></div>
                <div class="hero-content">
                    <div class="text-block hero-title">Discover Culinary Delights</div>
                    <p class="text-block hero-description">Unlock a world of exquisite recipes and elevate your cooking experience with FlavorFusion.</p>
                    <button class="button primary-button">Start Cooking</button>
                </div>
                <div class="image-container hero-image-container">
                    <img src="https://images.unsplash.com/photo-1606787366850-de6330128bfc?q=80&w=2940&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Delicious food spread" class="hero-img">
                </div>
            </section>

            <section class="workspace-section">
                <h2 class="section-title text-block">Explore Recipes</h2>

                <div class="controls-bar">
                    <div class="category-tags">
                        <button class="button category-tag active" data-category="All">All</button>
                        <button class="button category-tag" data-category="Breakfast">Breakfast</button>
                        <button class="button category-tag" data-category="Lunch">Lunch</button>
                        <button class="button category-tag" data-category="Dinner">Dinner</button>
                        <button class="button category-tag" data-category="Dessert">Dessert</button>
                    </div>
                    <div class="search-input-container">
                        <input type="text" id="recipe-search-input" class="input search-input" placeholder="Search recipes...">
                    </div>
                </div>

                <div class="recipe-grid" id="recipe-grid">
                    <!-- Recipe cards will be dynamically loaded here -->
                </div>
            </section>
        </main>
    </div>
    <script src="/script.js"></script>
</body>
</html>
