<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-Builder-Zoho UI</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
        #app-container {
            position: relative;
            /* Assuming a base resolution of 1920x1080 for component positioning */
            width: 1920px;
            height: 1080px;
            transform-origin: top left;
            /* Scale to fit the viewport while preserving aspect ratio */
            transform: scale(calc(100vw / 1920), calc(100vh / 1080));
        }
        .component {
            position: absolute;
            border: 1px dashed #ccc; /* For visualization of component bounds */
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        #button-1 {
            left: 2.138949394226074px;
            top: 3.7504308223724365px;
            width: 894.2648981643677px;
            height: 904.9844934940338px;
            background-color: #007bff;
            color: white;
            font-size: 24px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            text-align: center;
        }
        #text-block-1 {
            left: 928.2666015625px;
            top: 188.1075439453125px;
            width: 873.5684814453125px;
            height: 354.82012939453125px;
            background-color: #f8f9fa;
            padding: 20px;
            overflow: auto;
            text-align: left;
            color: #333;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <button id="button-1" class="component">Click Me</button>
        <div id="text-block-1" class="component">
            This is a text block. Its content can be dynamically loaded or pre-defined.
            The AppSpec did not specify explicit text content, so this is a placeholder.
            Click the button to see an API response here.
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Initialize Supabase client (using placeholder values for demonstration)
        // In a real application, these should be securely managed, e.g., via environment variables.
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('button-1');
            const textBlock = document.getElementById('text-block-1');

            button.addEventListener('click', async () => {
                console.log('Button clicked! Attempting to call backend-api.js...');
                try {
                    const response = await fetch('/api/backend-api');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    textBlock.textContent = `API response from backend-api.js: ${data.message} (Timestamp: ${data.timestamp})`;
                } catch (error) {
                    console.error('Error calling backend API:', error);
                    textBlock.textContent = `Error: ${error.message}. Please check your browser console for details.`;
                }
            });

            // Example: Fetching from ui-service.js on page load
            async function fetchUiServiceData() {
                console.log('Fetching data from ui-service.js...');
                try {
                    const response = await fetch('/api/ui-service');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    console.log('UI Service response:', data);
                    // You could update UI elements based on uiConfig here
                    if (data.uiConfig && data.uiConfig.buttonText) {
                        button.textContent = data.uiConfig.buttonText;
                    }
                } catch (error) {
                    console.error('Error calling UI service API:', error);
                }
            }
            fetchUiServiceData();
        });
    </script>
</body>
</html>
