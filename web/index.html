<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Gold 00 UI</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .component {
            position: absolute;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            padding: 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="component" style="left: 95.178px; top: 367.618px; width: 164.612px; height: 116.100px;">Button 1</button>
        <button class="component" style="left: 86.538px; top: 304.927px; width: 173.557px; height: 177.774px;">Button 2</button>
    </div>
    <script>
        document.querySelectorAll('.component').forEach(button => {
            button.addEventListener('click', () => {
                alert(`You clicked ${button.textContent}!`);
                // Example of a backend call
                fetch('/api/action', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ button: button.textContent, timestamp: new Date().toISOString() })
                })
                .then(response => response.json())
                .then(data => console.log('Backend response:', data))
                .catch(error => console.error('Error calling backend:', error));
            });
        });

        // Initial check to see if backend is alive
        fetch('/api/hello')
            .then(response => response.text())
            .then(data => console.log('Backend says:', data))
            .catch(error => console.error('Error fetching from backend:', error));
    </script>
</body>
</html>
