<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-Builder-Zoho UI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars from layout issues */
        }
        .canvas {
            position: relative;
            width: 100vw; /* Assume full viewport width */
            height: 100vh; /* Assume full viewport height */
            /* For scaling, assuming a base resolution like 1920x1080 */
            --base-width: 1920;
            --base-height: 1080;
            transform-origin: top left;
        }
        .component {
            position: absolute;
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
            border: 1px dashed #ccc; /* For visualization */
        }
    </style>
</head>
<body>
    <div class="canvas">
        <button class="component" style="left: 2.138949394226074px; top: 3.7504308223724365px; width: 894.2647981643677px; height: 904.9844934941198px;">
            <span data-component-token="button">Action Button</span>
        </button>
        <div class="component" style="left: 928.2666015625px; top: 188.1075439453125px; width: 873.5684814453125px; height: 354.82012939453125px; padding: 10px;">
            <p data-component-token="text-block">This is a block of text. It demonstrates the presence and layout of a text-block component detected from the original UI. The dimensions and position are preserved as closely as possible to the detected bounding box.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
